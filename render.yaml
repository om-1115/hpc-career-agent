# Render Blueprint for the public demo: one Node service serving the app and
# its API. The free plan's disk is wiped on every restart, so start:demo
# re-seeds the demo school each time and visitors always find it clean.
services:
  - type: web
    name: hpc-career-demo
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:demo
    healthCheckPath: /api/profiles
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SESSION_SECRET
        generateValue: true
